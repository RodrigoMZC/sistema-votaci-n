{% extends 'base.html' %}
{% block title %}Contraseña restablecida{% endblock %}

{% block extra_css %}
<style>
    .success-circle {
        width: 72px; height: 72px; border-radius: 50%;
        background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.25);
        display: flex; align-items: center; justify-content: center;
        font-size: 2rem; color: #22c55e;
    }
</style>
{% endblock %}

{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center" style="margin-top:-3rem;">
    <div class="card p-4 p-md-5 w-100 text-center" style="max-width:420px;">

        <div class="success-circle mx-auto mb-4"><i class="bi bi-check2-circle"></i></div>

        <h2 class="fw-black mb-2" style="font-size:1.5rem;letter-spacing:-.5px;">¡Todo listo!</h2>
        <p class="text-secondary mb-4" style="font-size:.9rem;line-height:1.6;">
            Tu contraseña fue restablecida exitosamente. Ya puedes iniciar sesión.
        </p>
        <div class="d-grid">
            <a href="{% url 'accounts:login' %}" class="btn btn-primary fw-bold">
                <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar sesión
            </a>
        </div>

    </div>
</div>
{% endblock %}
