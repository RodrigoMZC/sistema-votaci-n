upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;   # acepta cualquier dominio o IP
    client_max_body_size 20M;   # tamaño máximo de subida de archivos

    # Archivos estáticos servidos directamente por Nginx
    location /static/ {
        alias /app/staticfiles/;
    }

    # Archivos media servidos directamente por Nginx
    location /media/ {
        alias /app/media/;
    }

    # Todo lo demás va a Gunicorn
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

