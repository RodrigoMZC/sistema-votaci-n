services:

  # ── Base de datos PostgreSQL ────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: always
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  # ── Django + Gunicorn ────────────────────────────────────────
  web:
    build: .
    restart: always
    env_file: .env
    environment:
      DB_HOST: db
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - db
    networks:
      - backend
      - frontend
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn votaciones.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  # ── Nginx reverse proxy ─────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    networks:
      - frontend

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  backend:
  frontend:
